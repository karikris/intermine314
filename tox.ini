[tox]
minversion = 4.0
envlist = lint, py314, py314-analytics
skip_missing_interpreters = true

[testenv]
basepython = python3.14
# Packaging rejects Python <3.14.5; the interpreter name selects the minor line.
package = editable
extras = dev
setenv =
    INTERMINE314_RUN_LIVE_TESTS = 0
commands =
    python -m pytest -q {posargs:tests}

[testenv:lint]
skip_install = true
deps =
    ruff
commands =
    ruff check --no-cache .

[testenv:py314-dataframe]
description = Backward-compatible alias for analytics smoke check
commands =
    {[testenv:py314-analytics]commands}

[testenv:py314-analytics]
description = Unit tests + core Polars/DuckDB/Parquet analytics smoke check
extras =
    dev
    analytics
commands =
    {[testenv]commands}
    python -m scripts.analytics_smoke

[testenv:live]
description = Explicit live benchmark workload (network required)
setenv =
    RUN_LIVE = 1
commands =
    python benchmarks/runners/run_live.py --live-mode direct --transport-modes direct {posargs}
