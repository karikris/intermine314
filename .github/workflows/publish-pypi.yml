name: Publish To PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-policy:
    name: Validate Release Context
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Match event, version, commit and master ancestry
        id: policy
        run: python scripts/release_gate.py --json-out release-context.json

  validation:
    name: Validate Exact Release Commit
    needs: release-policy
    uses: ./.github/workflows/im-build.yml

  publish:
    name: Publish To PyPI
    needs: [release-policy, validation]
    if: github.event_name == 'push' && needs.release-policy.outputs.publish == 'true' && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/intermine314
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distribution artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validation.outputs.artifact_id }}
          path: release-artifacts
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts/dist
